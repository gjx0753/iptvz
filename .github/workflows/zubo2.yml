name: zubo2

on:
  schedule:
    - cron: '0 10 * * *'  # UTC 10:00 = 北京时间 18:00
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 增加超时限制，防止脚本卡死

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5  # 升级至 v5，消除 Node 20 弃用警告
        with:
          fetch-depth: 0   
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sed nmap
          pip install --upgrade yt-dlp  # 使用 pip 安装 yt-dlp 版本更新且更可控
        
      - name: 测试组播源
        run: |
          cd $GITHUB_WORKSPACE
          bash ./zubo.sh
          time=$(date +%Y/%m/%d)
          echo "浙江频道 $time 更新,#genre#" > zubo.txt
          
          # 使用循环拼接省份文件，代码更整洁易维护
          provinces="浙江 湖南 湖北电信 广东电信 北京联通 四川电信 浙江电信 江苏电信 上海电信 福建电信 安徽电信 江西电信 天津联通 河南联通 河南电信 河北电信 河北联通 山东电信 北京电信 陕西电信 广西电信 贵州电信 山西联通 重庆电信 海南电信 吉林电信 云南电信 湖北联通 山东联通 重庆联通 黑龙江联通 辽宁联通 甘肃电信 新疆电信 宁夏电信"
          for p in $provinces; do
            [ -f "txt/$p.txt" ] && cat "txt/$p.txt" >> zubo.txt
          done

      - name: 更新组播源
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          # 如果没有文件变更则跳过提交，防止 CI 报错失败
          git diff --staged --quiet || git commit -m "更新组播源"

      - name: Push To Gitee
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GE_TOKEN }}
          repository: ${{ secrets.GE_PATH }}
          directory: .
          branch: iptv
          force: true
          github_url: https://gitee.com

      - name: Push To Github
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          repository: ${{ secrets.GH_PATH }}
          directory: .
          branch: main  # 建议明确指定推送的分支（根据你的实际情况修改，如 master 或 main）
          force: true
