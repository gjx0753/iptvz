name: rm

on:
  workflow_dispatch:

# 添加写入权限，否则 git push 会失败
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        # 核心修复：升级到 v4 以支持 Node.js 24
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Delete Config Files
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf *_config.txt

      - name: Update and Push
        run: |
          git pull
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          # || true 的作用是：如果没有变更（commit为空），也不会报错退出
          git commit -m "..." || true
          git push
